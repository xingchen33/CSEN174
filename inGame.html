<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="./assets/inGame.css">
        <link rel="stylesheet" href="./assets/enemy.css">
        <link rel="stylesheet" href="./assets/player.css">
        <link rel="stylesheet" href="./assets/healthbar.css">
        <title>Warlock War</title>
    </head>
    <body>
        <div id="play-screen">

        <!-- TODO background image
        <img id="play-background" src="./assets/missing.jpg">
        -->
        <div id="items-container"></div>
        <div id="player-container" aria-label="Player"></div>
        <div id="enemies-container" aria-label="Enemies"></div>
        <div id="logic-card-draw-pile" class="card-holder card-pile"></div>
        <div id="logic-card-play-hand" class="card-holder card-hand"></div>
        <div id="action-card-draw-pile" class="card-holder card-pile"></div>
        <div id="action-card-play-hand" class="card-holder card-hand"></div>
        <div id="discard-pile" class="card-holder card-pile"></div>
        <button id="end-turn-button">End Turn</button>
        <section id="code-zone" aria-label="Code display">
            <h2>Code</h2>
            <p>No code assembled</p>
        </section>
        <p id="turn-indicator">Player Action</p>
        </div>
        <script type="module" src="./src/inGame.js"></script>
    </body>
</html>
