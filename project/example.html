<script>
    // Rate at which cards move (frames per second)
    STANDARDANIMATIONRATE = 24

    class Player {
        constructor (image="pacman.jpeg"){
            this.LogicCards = new CardGroup("hand",{"spread": 20, "h": 5, "w": 20, "origin": [30,69]})  // holds the logic cards in hand
            this.EffectCards = new CardGroup("hand",{"spread": 20, "h": 5, "w": 20, "origin": [70,69]}) // holds the effect cards in hand
            this.drawPile = new CardGroup("pile", {"origin": [1,69]})           // draw pile, holds cards to be drawn
            this.discardPile = new CardGroup("pile", {"origin": [85, 69]})      // discard pile, holds discarded cards
            this.image = image              // src for img element of the character
            this.vis = this.visualize()     // the img element of the character
            this.coords = [0, 0]

            /* Healthbar is WORK IN PROGRESS */ 
            // this.healthbar = new Healthbar(67,100)
            // this.healthbar.attachSprite(this)
            // this.healthbar.setLocation([10, 60])

        }

        addCard (card,drawPile=false){
            /*
            This method adds a card to either the draw pile, effect cards pile, or logic cards pile.
            */
            card.player = this                  // sets the card for player access
            if (drawPile==true){                // checks if card is to be sent to draw pile
                this.drawPile.addCard(card)     // send card to draw pile
                return
            }
            if (card.type == "l"){              // check if logic card
                this.LogicCards.addCard(card)   // add to logic card pile
            }           
            else {                              // all other cards
                this.EffectCards.addCard(card)  // go to effect cards pile
            }
        }
        addCards(cards, drawPile=false){
            /*
            Add many cards at once
            */
            cards.forEach(card => { 
                this.addCard(card, drawPile)
            });
        }

        draw() {
            /* 
            Draw card from draw pile
            */
            if (this.drawPile.cards.length == 0)    // check if any cards to draw
                return
            let card = this.drawPile.cards.pop()    // take card from draw pile
            this.addCard(card)                      // add card to correct hand

            /*
            Animation for drawing card 
            */
            let endpoint = [0,0]                    // default end for card moving animation

            if (card.type == "e"){                  // find target end for card moving animation
                endpoint = this.EffectCards.origin  // move to effect cards pile
            }
            if (card.type == "l"){
                endpoint = this.LogicCards.origin   // move to logic cards pile
            }
            card.card.style.zIndex = 10000          // move card to visual front
            card.moveAnimation(new Animation({"coords": endpoint, "time": 1, "onEnd": function(){}}))   // play animation
        }
        reviveCards(){
            /*
            Move all cards from discard pile to the draw pile
            */
            let discardCount = this.discardPile.cards.length    // get number of cards in discard pile
            for (let i =0; i<discardCount; i++){                // iterate through all cards in discard pile
                let card = this.discardPile.cards.pop()         // remove card from discard pile
                card.backToDraw()                               // move card to draw pile (animation)
                this.addCard(card,true)                         // add card to draw pile
            };
        }
        setLocation(coords=[10, 30]){
            /*
            set location for player img element to be moved to
            */
            this.coords = coords
            return 
        }
        visualize(coords=[10, 30]){
            /* 
            create and place img element on screen
            */
            this.setLocation(coords)                // set location for img to be made
            /*
            create img element
            */
            let vis = document.createElement("img") 
            vis.src = this.image
            vis.classList.add("playerImg")
            /* 
            place img element
            */
            vis.style.left = String(this.coords[0]) + "%"
            vis.style.top = String(this.coords[1]) + "%"
            document.body.appendChild(vis)
            
            return vis
        }
        updateAllCardDisplays(){
            [this.EffectCards, this.LogicCards, this.drawPile].forEach((pile) => {
                this.discardPile.addCards(pile.discarded())
            });
            [this.EffectCards, this.LogicCards, this.discardPile, this.drawPile].forEach((pile)=>{
                pile.updateDisplay()
            })
        }
    }

            this.enemies = []

            return enemySprite
        }
        setLocation(coords){
            this.coords = coords
            this.vis.style.left = String(this.coords[0]) + "%"
            this.vis.style.top = String(this.coords[1]) + "%"

    // WORK IN Progress
    class Healthbar {
        constructor (health=67, maxHealth=67, color1="#eb4034", color2="#000000", color3="#ffffff"){
            this.health = health 
            this.max = maxHealth
            this.color1 = color1 
            this.color2 = color2 
            this.color3 = color3
            let vis = this.createVisuals()
            this.empty = vis[0]
            this.fill = vis[1]
            this.display = vis[2]
            this.coords = [0,0]
            this.sprite = null
            this.updateVisual()
        }
        setLocation (coords = [0,0]) {
            this.coords = coords 
            this.empty.style.top = String(coords[1]) + "%"
            this.empty.style.left = String(coords[0]) + "%"
        }  
        attachSprite(sprite){
            this.sprite = sprite
        }

        updateVisual(){
            this.fill.style.width = String((this.health/this.max)*100) + "%"
            
            this.display.innerText = `${this.health} / ${this.max}`
            console.log(`${this.health} / ${this.max}`)
        }   
        createVisuals(width=10, height=3){
            let empty = document.createElement("div")
            empty.style.background = this.color2
            empty.style.position = "absolute"
            empty.style.width = String(width) + "%"
            empty.style.height = String(height) + "%"
 
            let fill = document.createElement("div")
            fill.style.background = this.color1 
            fill.style.position = "absolute"
            fill.style.left = "0%"
            fill.style.height = "100%"

            let display = document.createElement("frame")
            display.style.position = "absolute"
            display.style.height = "100%"
            display.style.width = "100%"
            display.style.textAlign = "center"
            display.style.color = this.color3 

            empty.appendChild(fill)
            empty.appendChild(display)
            document.body.appendChild(empty)

            return [empty, fill, display]
        }
    }




    class Card {
        constructor (type, name, description, effects, energy, customization={}, tags={}){
            this.type = type
            this.name = name 
            this.description = description
            this.effects = effects
            this.energy = energy 
            this.customization = customization
            this.cardPos = [0,0]
            this.discarded = false
            this.player = null
            // this.effects.forEach((effect) => {
            //     console.log(effect)
            // })
            this.tags = this.tags
            this.card = this.show()
            this.card.addEventListener("click", ()=>{
                if (this.selectable){ // EXAMPLE FUNCTION
                    // if (this.card.classList.contains("flipped")){
                    //     this.card.classList.remove("flipped")
                    // }
                    // else {
                    //     this.card.classList.add("flipped")
                    // }
                    this.discard();
                }
            })

            this.rotation = 0
            
            this.selectable = true

            this.updateCardVisual()
        }

        backToDraw(){
            this.discarded = false
            this.card.style.zIndex = 100000
            this.moveAnimation(
                new Animation(
                    {
                        "coords": this.player.drawPile.origin, 
                        "time": 1.5,
                        "onEnd": this.player.updateAllCardDisplays // not working
                    }))
        }

        discard(){
            // may want to add a cooldown
            this.discarded = true
            this.card.style.zIndex = 100000
            this.moveAnimation(
                new Animation(
                    {
                        "coords": this.player.discardPile.origin, 
                        "time": 1.5,
                        "onEnd": this.player.updateAllCardDisplays // not working
                    }))
            // this.player.updateAllCardDisplays()
        }

        updateCardVisual(){
            if (this.player == null){
                this.hidden()
                return
            }
            this.shown()
            if (this.selectable == true)
                this.card.classList.add("cardSelectable")
            else 
                this.card.classList.remove("cardSelectable")

            
            if (this.getActualEnergy() == 0)
                this.hideEnergy()
            // else 
            //     this.showEnergy()

            // this.card.style.transform = "rotate(" + String(this.rotation) + "deg)"

            this.card.style.left = String(this.cardPos[0]) + "%"
            this.card.style.top = String(this.cardPos[1]) + "%"

        }

        show(){
            return visualize(this)
        }
        getActualDamage(){
            return "placeholder"
        }
        getActualEnergy(){
            return this.energy // just here for now, we can modify later of course
        }
        setLocation(x,y){
            this.cardPos[0] = x
            this.cardPos[1] = y
            this.updateCardVisual()
        }
        shiftLocation(shift=[0,0]){
            this.cardPos[0] += shift[0]
            this.cardPos[1] += shift[1]
            this.updateCardVisual()
        }
        getLocation(){
            return this.cardPos
        }
       
        setRotation(r){
            this.rotation = r
            this.updateCardVisual()
        }
        adjustRotation(n){
            this.rotation += n
            this.updateCardVisual()
        }
        getRotation(){
            return this.rotation
        }
        hideEnergy(){
            this.card.cNRG.style.display= "none";
        }
        showEnergy(){
            this.card.cNRG.style.display= "block";
        }
        moveAnimation(destinations){
            return
            
        }
        moveAnimation(destination){
            let initialCoords = this.getLocation()
            let frames = destination.time*STANDARDANIMATIONRATE
            let stepSize = [
                (destination.coords[0] - initialCoords[0])/frames,
                (destination.coords[1] - initialCoords[1])/frames
            ]
            this.animationFrame(stepSize, destination.onEnd, frames)
        }
        animationFrame(change, onEnd, framesRemaining){
            if (framesRemaining == 0){
                // onEnd()
                this.player.updateAllCardDisplays()
                return
            }
            this.shiftLocation(change)
            setTimeout(() => {this.animationFrame(change, onEnd, framesRemaining-1)}, 100/STANDARDANIMATIONRATE);
            return

        }
        
        hidden(){
            this.card.style.display = "none"
        }
        shown(){
            this.card.style.display = "block"
        }
    }
    
    class Animation {
        constructor (details={"coords": [0,0], "time": 4, "onEnd": function(){}}){
            this.coords = details["coords"]
            this.time = details["time"]
            this.onEnd = details["onEnd"]
        }
    }

    class CardGroup {
        constructor (type, visuals={"spread": 40, "h": 5, "w": 20, "origin": [50,70]}){
            this.type = type 
            this.cards = []
            this.origin = [0,0]
            this.visuals = visuals
            // if (this.type== "hand")
            this.origin = this.visuals.origin
            // console.log(this.origin)
        }
        addCards(cards){ 
            cards.forEach((card) => {
                this.addCard(card)
            });
        }
        addCard(card){
            this.cards.push(card)
            // this.updateDisplay()
        }
        discarded(){
            let discardedCards = []
            this.cards.forEach((card) => {
                if (card.discarded){
                    this.cards.splice(this.cards.indexOf(card),1)
                    discardedCards.push(card)
                }
            });
            return discardedCards
        }

        updateDisplay(){
            let vh = this.visuals["h"]
            let hw = this.visuals["w"]
            let n = this.cards.length
            let sw = screen.width
            if (this.type == "hand"){
                this.cards.forEach((card, index) => {
                    card.selectable = true
                    card.card.classList.remove("flipped")

                    let cardWidth = 100*card.card.offsetWidth/sw
                    let xChange = -Math.cos(Math.PI*((index+1)/(n+1)))*(hw - cardWidth/2) - cardWidth/2

                    // let xChange = (index+1)/(n+1)*hw-hw
                    // console.log(index, this.origin[0]+xChange)

                    let yChange = Math.sin(Math.PI*((index+1)/(n+1)))*vh
                    card.setLocation(this.origin[0]+xChange, this.origin[1]-yChange)
                    card.card.style.zIndex =index
                });
            }
            if (this.type == "pile"){
                this.cards.forEach((card, index) => {
                    card.selectable = false
                    card.card.classList.add("flipped")
                    card.card.style.zIndex = -index
                    card.setLocation(this.origin[0], this.origin[1])
                });
            }
        }
        takeTop(){
            return this.cards.pop()
        }
    }
    
    function visualize(selected_card){
        cardBase = document.createElement("div")
        cardBase.classList.add("cardBase")
        cardBase.style.position = "absolute"
        // cardBase.style.transformOrigin = "0 0"

        cardContents = document.createElement("div")
        cardContents.classList.add("cardContents","cardItem")
        if (Object.hasOwn(selected_card.customization, "bg")){
            cardContents.style.background = selected_card.customization["bg"]
        }

        cardBack = document.createElement('img')
        cardBack.src = "pokemon.png"
        cardBack.classList.add("cardBack", "cardItem")
        
        cardName = document.createElement("div")
        cardName.classList.add("cardName","cardItem")
        cardName.innerText = selected_card.name
        if (Object.hasOwn(selected_card.customization, "lbg")){
            cardName.style.background = selected_card.customization["lbg"]
        }

        cardDesc = document.createElement("div")
        cardDesc.classList.add("cardDesc","cardItem")
        cardDesc.innerText = selected_card.description
        if (Object.hasOwn(selected_card.customization, "cdbg")){
            cardDesc.style.background = selected_card.customization["cdbg"]
        }

        cardEnergy = document.createElement("div")
        cardEnergy.classList.add("cardNRG", "cardItem")
        cardEnergy.innerText = selected_card.getActualEnergy()
        if (Object.hasOwn(selected_card.customization, "nrgbg")){
            cardEnergy.style.background = selected_card.customization["nrgbg"]
        }

        document.body.appendChild(cardBase)
        cardBase.appendChild(cardContents)
        cardBase.cBack = (cardBack)
        cardBase.appendChild(cardBack)

        cardBase.cName = cardName
        cardContents.appendChild(cardName)
        cardBase.cDesc = cardDesc
        cardContents.appendChild(cardDesc)
        cardBase.cNRG = cardEnergy
        cardContents.appendChild(cardEnergy)

        return cardBase
    }
